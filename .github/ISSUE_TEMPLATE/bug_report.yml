name: Bug report
description: Something is broken in NextSeat
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please remove real room tokens and personal links before submitting.
  - type: input
    id: version
    attributes:
      label: NextSeat version
      placeholder: "0.6.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Host platform
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the NextSeat panel
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Please remove tokens and personal links.
      render: shell
