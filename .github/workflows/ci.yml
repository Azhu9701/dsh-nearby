name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Validate package manifest
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle||!p.dsh.bundle.patch) throw new Error('missing dsh.bundle.patch'); if(!p.dsh.client||p.dsh.client.platform!=='web') throw new Error('missing dsh.client'); console.log('package.json ok', p.name, p.version)"
      - name: Validate locale files
        run: |
          node -e "for (const f of ['locale/zh.json','locale/en.json']) { const j=require('./'+f); if(!j.meta||!j.meta.title) throw new Error(f+' missing meta.title'); } console.log('locale ok')"
      - name: Check guest page is present
        run: test -s guest.html
