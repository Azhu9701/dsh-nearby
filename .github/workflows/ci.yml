name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      # The manifest, screenshot list and the host-route trust fence are all
      # submission surfaces: the catalog reads them from this repository, and a
      # regression in one of them does not break any other check. test/ pins
      # them, so the suite runs before the pack smoke test.
      - name: Contract tests
        run: node --test test/*.test.mjs
      - name: Packed tarball carries the patch and the client half
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent --pack-destination /tmp)
          echo "packed: $tarball"
          tar -tzf "/tmp/$tarball" > /tmp/pack-files.txt
          for want in package/cordis.patch.yml package/client.js package/index.js package/guest.html package/screenshots.json; do
            grep -qx "$want" /tmp/pack-files.txt || { echo "missing from tarball: $want"; exit 1; }
          done
          if grep -q '^package/test/' /tmp/pack-files.txt; then
            echo "test/ should not be published"; exit 1
          fi
          echo "tarball ok"
